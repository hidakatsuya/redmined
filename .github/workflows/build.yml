name: Build and push redmined image

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - ruby-version: "3.4"
            dockerfile: Dockerfile.bookworm
            tags: "ghcr.io/hidakatsuya/redmined:ruby3.4"

          - ruby-version: "3.4"
            dockerfile: Dockerfile
            tags: "ghcr.io/hidakatsuya/redmined:ruby3.4-trixie"

          - ruby-version: "4.0"
            dockerfile: Dockerfile.bookworm
            tags: "ghcr.io/hidakatsuya/redmined:ruby4.0,ghcr.io/hidakatsuya/redmined:latest"

          - ruby-version: "4.0"
            dockerfile: Dockerfile
            tags: "ghcr.io/hidakatsuya/redmined:ruby4.0-trixie"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: RUBY_VERSION=${{ matrix.ruby-version }}
          tags: ${{ matrix.tags }}
